# בניית האפליקציה ופרסומה.
# כל דחיפה ל-main: בונה APK חתום ומפרסם אותו כ-Release (הקישור הקבוע: releases/latest/download/apk-store.apk).
# Pull request או הרצה ידנית: בונה ומעלה את הקובץ כ-artifact בלבד.
name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # מפתח החתימה מהסודות של המאגר. בלעדיו הבנייה עוברת, אבל לא מתפרסמת
      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing - building with the debug key, nothing will be published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk apk-store.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk-store-${{ env.VERSION_NAME }}
          path: apk-store.apk

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.key.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: apk-store.apk
          body: |
            להורדה: **apk-store.apk** (למטה, תחת Assets).
            ${{ github.event.head_commit.message }}

  # בדיקות מול פליי ו-APKPure החיים - מידע בלבד, לא עוצרות את הפרסום
  # (שירות חיצוני יכול להיות עמוס או לחסום שרתי GitHub)
  tests:
    name: Tests (live Play / APKPure)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/outputs/play-report.txt
            app/build/outputs/roborazzi/
